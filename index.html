<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/takes/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/takes/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EEE3" />
    <meta name="description" content="Takes: sort, listen to and annotate music demos" />
    <title>Takes</title>
    <script>
      // The Homegrown Look setting, applied before first paint (same key as Mise and Priorities).
      try {
        var look = localStorage.getItem('homegrown:look');
        if (look === 'calm' || look === 'sunny') document.documentElement.dataset.whimsy = look;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
